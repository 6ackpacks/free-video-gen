<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}
.topbar{height:62px;background:#171714;color:#fff;display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:20}.brand{font-weight:900;letter-spacing:-.06em;font-size:20px}.brand em{font-style:normal;color:#ef6b47}.mode-switch{display:flex;align-self:stretch;border-left:1px solid #33332f}.mode-switch a{display:flex;flex-direction:column;justify-content:center;gap:3px;color:#8f8f88;text-decoration:none;padding:0 18px;border-bottom:3px solid transparent}.mode-switch a b{font-size:11px}.mode-switch a small{font:700 8px ui-monospace,monospace}.mode-switch a.active{color:#fff;border-color:#ef6b47;background:#22221f}.mode-switch a:hover{color:#fff}.tabs{display:flex;align-self:stretch}.tab{display:flex;align-items:center;border:0;background:transparent;color:#9f9f98;padding:0 20px;font-size:13px;font-weight:700;border-bottom:3px solid transparent;text-decoration:none}.tab.active{color:#fff;border-color:#ef6b47}.topbar-status{margin-left:auto;font-size:11px;color:#aaa;white-space:nowrap}.topbar-status b{color:#fff}
.wrap{max-width:1420px;margin:auto;padding:34px}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:end;margin-bottom:28px}.eyebrow{font:800 11px/1.2 ui-monospace,monospace;letter-spacing:.13em;color:var(--red)}h1{font:800 clamp(34px,5vw,68px)/.98 "Songti SC","STSong",serif;letter-spacing:-.055em;margin:12px 0 0;max-width:780px}.hero p{color:var(--muted);line-height:1.85;margin:0;max-width:560px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.mode{background:transparent;border:1px solid var(--line);text-align:left;padding:20px;border-radius:5px;min-height:128px;transition:.2s}.mode:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.mode.active{background:var(--ink);border-color:var(--ink);color:#fff}.mode b{font:800 20px/1.2 "Songti SC","STSong",serif;display:block;margin:8px 0}.mode span,.mode small{display:block}.mode span{font:700 10px ui-monospace,monospace;color:var(--red)}.mode.active span{color:#ff8768}.mode small{line-height:1.55;color:var(--muted)}.mode.active small{color:#bdb9b0}
.api-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-10px 0 24px}.api-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#ebe7de;padding:9px 11px;font-size:10px;color:var(--muted)}.api-item strong{color:var(--ink)}.api-dot{width:7px;height:7px;border-radius:50%;background:#aaa;flex:none}.api-dot.ready{background:var(--green)}
.panel{display:none}.panel.active{display:block}.flow{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--card);margin-bottom:18px}.flow.five{grid-template-columns:repeat(5,1fr)}.flow div{padding:15px 17px;border-right:1px solid var(--line);font-size:11px;color:var(--muted)}.flow div:last-child{border:0}.flow b{display:block;color:var(--ink);font:800 13px/1.3 "Songti SC","STSong",serif;margin-bottom:4px}.flow .on{box-shadow:inset 0 -3px var(--red)}
.grid{display:grid;grid-template-columns:340px minmax(460px,1fr);gap:16px;align-items:start}.stack{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:0 3px 15px #41382b0a;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{font:800 15px/1.2 "Songti SC","STSong",serif;margin:0}.step{font:700 9px ui-monospace,monospace;color:#9a958a}.body{padding:17px}.field{margin-bottom:15px}.field:last-child{margin-bottom:0}.label{display:block;font-size:11px;font-weight:800;margin-bottom:7px}.hint{font-size:10px;color:var(--muted);line-height:1.6}.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;padding:10px;border-radius:3px;font-size:12px;color:var(--ink);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 2px #1b1b1811}textarea{min-height:78px;resize:vertical;line-height:1.55}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 15px;border-radius:3px;font-size:11px;font-weight:800}.btn.alt{background:#fff;color:var(--ink);border-color:var(--line)}.btn.red{background:var(--red);border-color:var(--red)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn.grow{flex:1}.notice{padding:10px 12px;border-left:3px solid var(--amber);background:#fff7e8;font-size:10px;line-height:1.6;margin-top:10px}.notice.good{border-color:var(--green);background:#edf8f1}.notice.bad{border-color:var(--red);background:#fff0ed}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.promptcard{border:1px solid var(--line);padding:12px;background:#fff;min-height:150px}.promptcard b{font:800 12px "Songti SC","STSong",serif}.promptcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tag{font:700 9px ui-monospace,monospace;background:#eeeae0;padding:4px 6px}.promptcard p{font-size:10px;color:var(--muted);line-height:1.55;margin:0}.promptcard textarea{font-size:10px;line-height:1.5;min-height:190px;margin-top:8px}.promptcard details{margin-top:9px;font-size:9px;color:var(--muted)}.promptcard details summary{cursor:pointer;font-weight:800}.promptcard details pre{white-space:pre-wrap;max-height:180px;overflow:auto;border-top:1px solid var(--line);padding-top:8px;font:9px/1.55 inherit;color:var(--ink)}.batchtools,.download-actions{display:flex;align-items:center;gap:8px}.download-actions{margin-top:12px}.download-actions .btn{text-decoration:none;text-align:center;flex:1;padding:9px}.download-actions .btn.alt{flex:0 0 auto}.download-message{font-size:10px;color:var(--muted);margin-top:10px;min-height:16px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shot{border:1px solid var(--line);background:#fff;position:relative}.shot img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#e9e5db}.shot .empty{aspect-ratio:9/16;display:grid;place-items:center;background:#e9e5db;color:#8c877d;font-size:11px;text-align:center;padding:16px}.shotmeta{padding:10px}.shotmeta b{font-size:11px}.shotmeta small{display:block;color:var(--muted);font-size:9px;line-height:1.45;margin:4px 0}.accept{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800}.accept input{width:auto}.tiny{border:0;background:transparent;color:var(--red);font-size:9px;padding:0;text-decoration:underline}.status{display:inline-flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#aaa}.dot.complete{background:var(--green)}.dot.error{background:var(--red)}.dot.running,.dot.waiting,.dot.submitting{background:var(--amber);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ref{border:1px solid var(--line);padding:0;background:#fff;position:relative}.ref.active{outline:3px solid var(--red);outline-offset:-3px}.ref img{width:100%;height:105px;object-fit:cover;display:block}.ref span{display:block;padding:6px;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload{display:block;border:1px dashed #918b80;padding:10px;text-align:center;font-size:10px;font-weight:800;margin-top:8px}.upload input{display:none}.actionslist{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:430px;overflow:auto}.action{border:1px solid var(--line);background:#fff;padding:10px;text-align:left;border-radius:3px}.action.active{border:2px solid var(--red);padding:9px}.action:disabled{opacity:.35}.action b,.action small{display:block}.action b{font-size:10px}.action small{color:var(--muted);font-size:9px;line-height:1.4;margin-top:4px}.reviewbox{border:1px solid var(--line);background:#fff;padding:14px}.reviewbox pre{white-space:pre-wrap;font:10px/1.6 ui-monospace,monospace;max-height:230px;overflow:auto}.video{width:100%;background:#171714;min-height:300px}.video video{width:100%;max-height:520px;display:block}.hidden{display:none!important}
.page-title{display:flex;align-items:end;justify-content:space-between;margin:4px 0 18px}.page-title h1{font:800 28px/1 "Songti SC","STSong",serif;margin:0}.page-title span{font-size:10px;color:var(--muted)}.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setupgrid .field{margin:0}.setupgrid .wide{grid-column:1/-1}.directionbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:12px}.directionbar textarea{min-height:48px}.directionbar .btn{height:40px}.shot textarea{min-height:72px;font-size:10px;margin-top:8px}.mini-label{display:block;margin-top:8px;font-size:9px;font-weight:800;color:var(--muted)}
.hero{display:none}.wrap{padding:24px}.api-strip{display:flex;gap:14px;margin:0 0 14px;padding:0}.api-item{border:0;background:transparent;padding:0;font-size:9px}.flow,.flow.five{display:flex;background:transparent;border:0;border-bottom:1px solid var(--line);margin-bottom:12px}.flow div{flex:1;border:0;padding:8px 10px;font-size:0}.flow b{font:800 10px/1.2 inherit;margin:0;color:var(--muted)}.flow .on{box-shadow:inset 0 -2px var(--red)}.flow .on b{color:var(--ink)}
.contentbar{display:flex;align-items:center;gap:7px;margin:-5px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}.contentbar>span{font:800 9px ui-monospace,monospace;color:#999;margin-right:5px}.contentbar a{border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#777;text-decoration:none;font-size:10px;font-weight:800;background:#faf8f2}.contentbar a:hover{border-color:#777;color:#222}.contentbar a.active{background:var(--ink);border-color:var(--ink);color:#fff}.contentbar a.story{margin-left:auto;border-style:dashed}
@media(max-width:980px){.wrap{padding:22px}.hero,.grid{grid-template-columns:1fr}.preview,.gallery{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}.flow div:nth-child(2){border-right:0}.modes,.api-strip{grid-template-columns:1fr}h1{font-size:44px}}
</style>
<link rel="stylesheet" href="/workbench-ui.css"><script defer src="/workbench-ui.js"></script></head>
<body>
<header class="topbar"><div class="brand">帧<em>间</em></div><nav class="mode-switch"><a href="/?mode=store"><small>MODE 01</small><b>足浴店底图 → 多视频</b></a><a class="active" href="/?mode=paired"><small>MODE 02</small><b>家庭按摩 · 每图一视频</b></a></nav><nav class="tabs"><a class="tab active" href="/?mode=paired">视频生成</a><a class="tab" href="/?mode=store&tab=accounts">豆包账号池</a></nav><div class="topbar-status"><span id="apiStatus">接口检查中</span></div></header>
<main class="wrap">
  <section class="page-title"><h1>图生视频</h1><span>提示词 → 图片 → 视频指令 → 生成</span></section>
  <nav id="contentNav" class="contentbar" aria-label="场景模板"><span>内容模板</span></nav>
  <section id="apiStrip" class="api-strip" aria-label="API 配置状态">
    <div class="api-item"><i class="api-dot"></i><span>正在读取本地 API 配置…</span></div>
  </section>

  <section id="pairedPanel" class="panel active">
    <div class="flow five"><div class="on"><b>01 设定</b></div><div><b>02 提示词</b></div><div><b>03 图片</b></div><div><b>04 视频指令</b></div><div><b>05 生成</b></div></div>
    <div class="grid">
      <aside class="stack">
        <section class="card"><div class="head"><h2>设置</h2></div><div class="body">
          <div class="setupgrid">
            <div class="field"><label class="label">家庭场景</label><select id="sceneMode"><option value="mixed">沙发 / 床随机</option><option value="sofa">只用家庭沙发</option><option value="bed">只用家庭床上</option></select></div>
            <div class="field"><label class="label">画面重点</label><select id="focusMode"><option value="mixed">技师形象 / 按摩动作混合</option><option value="action">重点展示按摩动作，同时带到技师</option><option value="beauty">重点展示技师形象</option></select></div>
            <div class="field"><label class="label">脚部露出</label><select id="footMode"><option value="mixed">完整 / 局部 / 不露随机</option><option value="visible">每张都露出脚</option><option value="hidden">不直接露脚，突出人物</option></select></div>
            <div class="field"><label class="label">数量</label><input id="pairCount" type="number" min="1" max="100" value="9"></div>
            <div class="field wide"><label class="label">图片补充</label><textarea id="imageExtra" placeholder="可留空"></textarea></div>
          </div>
          <button id="previewTuning" class="btn alt" style="width:100%">让大模型生成整批提示词</button>
          <div id="promptMessage"></div>
          <div class="notice">22–32 岁年轻女性 · 人物不重复 · 30 套服装轮换 · 制服 / 吊带 / 露肩 / 露背 / 露腰</div>
        </div></section>
        <section id="quantityCard" class="card hidden"><div class="head"><h2>图片与视频参数</h2><span class="step">AFTER PROMPT REVIEW</span></div><div class="body">
          <div id="approvedPromptCount" class="notice good">提示词尚未确认。</div>
          <button id="startImages" class="btn red" style="width:100%">开始批量生成图片</button><div id="pairMessage"></div>
        </div></section>
      </aside>
      <div class="stack">
        <section class="card"><div class="head"><h2>提示词</h2><div><button id="selectAllPrompts" class="btn alt">全选</button> <button id="clearPromptSelection" class="btn alt">全不选</button> <button id="confirmTuning" class="btn" disabled>确认提示词</button></div></div><div class="body"><div id="pairPreview" class="preview"><div class="hint">生成后逐条修改。</div></div></div></section>
        <section id="imageReviewCard" class="card hidden"><div class="head"><h2>图片与视频指令</h2><span id="imageProgress" class="step"></span></div><div class="body">
          <div class="cols"><div class="field"><label class="label">视频模型</label><select id="pairRoute"></select></div><div class="field"><label class="label">时长</label><input id="pairDuration" type="number" min="2" max="15" value="5"></div></div>
          <div class="field"><label class="label">分辨率</label><select id="pairResolution"><option>480P</option><option>720P</option><option>1080P</option></select></div>
          <div class="directionbar"><div><label class="label">整批视频补充</label><textarea id="batchVideoDirection" placeholder="例如：整体动作更轻缓，镜头不要晃。留空即可。"></textarea><div class="hint">固定 BGM：配上优雅暧昧的音乐（纯音乐、无歌词、无对白）</div></div><button id="applyBatchDirection" class="btn alt">填入每条</button></div>
          <div id="imageGallery" class="gallery"></div>
          <div class="btnrow" style="margin-top:14px"><button id="confirmImages" class="btn red grow">确认图片，先生成 1 条试片</button></div><div id="imageMessage"></div>
        </div></section>
        <section id="videoBatchCard" class="card hidden"><div class="head"><h2>视频批次</h2><div class="batchtools"><span id="videoProgress" class="step"></span><button id="downloadAll" class="btn red" disabled>一键下载全部</button></div></div><div class="body"><div id="videoJobs" class="preview"></div><div id="downloadMessage" class="download-message"></div></div></section>
      </div>
    </div>
  </section>

</main>
<script>
window.WorkbenchCache=(()=>{
 const namespace='workbench:v1:'+location.pathname+':'+(new URLSearchParams(location.search).get('pack')||new URLSearchParams(location.search).get('mode')||'paired');
 const read=(name,fallback={})=>{try{return JSON.parse(localStorage.getItem(namespace+':'+name))||fallback}catch{return fallback}};
 const write=(name,value)=>{try{localStorage.setItem(namespace+':'+name,JSON.stringify(value));return true}catch{let warning=document.getElementById('cacheWarning');if(!warning){warning=document.createElement('div');warning.id='cacheWarning';warning.setAttribute('role','alert');warning.style.cssText='padding:12px;background:#fff3d8;color:#7c3900';document.body.prepend(warning)}warning.textContent='本机草稿保存失败，请复制提示词后再离开页面。';return false}};
 const fields=read('fields');
 function restore(){for(const [id,value] of Object.entries(fields)){const el=document.getElementById(id);if(!el||el.type==='file'||el.type==='password')continue;if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===value))continue;if(el.type==='checkbox')el.checked=value;else el.value=value}}
 function save(){for(const el of document.querySelectorAll('input[id],select[id],textarea[id]')){if(el.type==='file'||el.type==='password')continue;fields[el.id]=el.type==='checkbox'?el.checked:el.value}write('fields',fields)}
 restore();document.addEventListener('input',save);document.addEventListener('change',save);window.addEventListener('pagehide',save);
 return{read,write,restore,save};
})();
</script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(route,options={}){const r=await fetch('/api'+route,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),data=await r.json();if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);return data}
let provider={},previewPairs=[],currentImageBatch=null,currentVideoBatch='',videoDirections={};
function note(target,text,type=''){target.innerHTML=`<div class="notice ${type}">${esc(text)}</div>`}
function renderContentNav(packs){$('contentNav').innerHTML='<span>内容模板</span>'+packs.filter(p=>p.status==='active'&&p.engine!=='timeline-story').map(p=>`<a class="${p.id==='home-massage'?'active':''}" href="${p.engine==='reference-pairs'?`/?mode=paired&pack=${encodeURIComponent(p.id)}`:`/?mode=store&pack=${encodeURIComponent(p.id)}`}">${esc(p.navLabel||p.name)}</a>`).join('')+'<a class="story" href="/story">短剧生成</a>'}
function routeOptions(id){const select=$(id),usable=(provider.routes||[]).filter(x=>x.configured||x.id==='doubao');if(id==='pairRoute')usable.sort((a,b)=>(b.referenceMode==='reference-image')-(a.referenceMode==='reference-image'));select.innerHTML=usable.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.model)}${id==='pairRoute'?` · ${x.referenceMode==='reference-image'?'自由参考':'描述重绘'}`:''}</option>`).join('');if(id==='pairRoute'){const preferred=usable.find(x=>x.id==='wan-aliyun')||usable.find(x=>x.referenceMode==='reference-image');if(preferred)select.value=preferred.id;select.onchange=syncPairVideoSettings;syncPairVideoSettings()}}
function syncPairVideoSettings(){const route=(provider.routes||[]).find(x=>x.id===$('pairRoute').value);if(!route)return;const duration=$('pairDuration');duration.min=route.duration?.min||2;duration.max=Math.min(15,route.duration?.max||15);if(route.id==='apimart')duration.value=6;else if(route.id==='doubao'&&![5,10].includes(Number(duration.value)))duration.value=5;const values=route.resolutions||['480P'];$('pairResolution').innerHTML=values.map(x=>`<option>${esc(x)}</option>`).join('')}
function renderApiStatus(){const routes=(provider.routes||[]).filter(x=>x.configured).map(x=>x.name).join(' / ')||'尚未配置';$('apiStrip').innerHTML=`<div class="api-item"><i class="api-dot ${provider.promptModel?'ready':''}"></i><span>提示词 · <strong>${esc(provider.promptModel||'未配置')}</strong></span></div><div class="api-item"><i class="api-dot ${provider.keyframeConfigured?'ready':''}"></i><span>图片 · <strong>${esc(provider.imageModel||'未配置')}</strong></span></div><div class="api-item"><i class="api-dot ${provider.configured?'ready':''}"></i><span>视频 · <strong>${esc(routes)}</strong></span></div>`;$('apiStatus').innerHTML=`<b>多模型路由</b> · ${esc(provider.promptModel||'提示词规则编译')}`}
function tuning(){return{sceneMode:$('sceneMode').value,focusMode:$('focusMode').value,footMode:$('footMode').value,imagePrompt:$('imageExtra').value,videoPrompt:'',variantKey:String(Date.now()),count:Number($('pairCount').value)}}

const cache=WorkbenchCache, saved=cache.read('workflow');
previewPairs=saved.previewPairs||[];currentVideoBatch=saved.currentVideoBatch||'';videoDirections=saved.videoDirections||{};
let approved=!!saved.approved,draftTask=saved.draftTask||'',draftRequest=saved.draftRequest||null,imageSubmitting=false,accepted=saved.accepted||{},promptSelection=saved.promptSelection||{};
function saveWorkflow(){cache.write('workflow',{previewPairs,approved,draftTask,draftRequest,currentImageBatchId:currentImageBatch?.id||saved.currentImageBatchId||'',currentVideoBatch,videoDirections,accepted,promptSelection});cache.save()}
function selectedPromptPairs(){return previewPairs.filter(p=>promptSelection[p.id])}
function updatePromptSelection(){const count=selectedPromptPairs().length;$('confirmTuning').disabled=!count||approved||!!draftTask||!!draftRequest;$('confirmTuning').textContent=approved?`✓ 已确认 ${count} 条`:`确认选中的 ${count} 条`;$('quantityCard').classList.toggle('hidden',!approved);$('approvedPromptCount').textContent=`已确认 ${count} / ${previewPairs.length} 条提示词，只生成勾选的图片。`;if(!imageSubmitting&&!currentImageBatch?.progress?.active)$('startImages').textContent=`生成选中的 ${count} 张图片`;}
function chooseAllPrompts(value){for(const p of previewPairs)promptSelection[p.id]=value;approved=false;saveWorkflow();renderPrompts()}
function renderPrompts(){
 $('pairPreview').innerHTML=previewPairs.length?previewPairs.map(p=>`<article class="promptcard"><label class="accept"><input type="checkbox" data-prompt-select="${p.id}" ${promptSelection[p.id]?'checked':''}> 选用提示词 ${p.index}</label><div class="tags"><span class="tag">${esc(p.variation.home)}</span><span class="tag">${esc(p.variation.focus)}</span><span class="tag">脚部 ${esc(p.variation.foot)}</span><span class="tag">BGM · 优雅暧昧</span></div><p>${esc(p.variation.appearance)}<br>${esc(p.variation.clothing)}</p><textarea data-prompt="${p.id}">${esc(p.imagePrompt)}</textarea></article>`).join(''):'<div class="hint">生成后逐条修改。</div>';
 updatePromptSelection();document.querySelectorAll('[data-prompt-select]').forEach(el=>el.onchange=()=>{promptSelection[el.dataset.promptSelect]=el.checked;approved=false;saveWorkflow();updatePromptSelection()});

 $('quantityCard').classList.toggle('hidden',!approved);
 updatePromptSelection();
 document.querySelectorAll('[data-prompt]').forEach(el=>el.oninput=()=>{const p=previewPairs.find(p=>p.id===el.dataset.prompt);p.imagePrompt=el.value;approved=false;saveWorkflow();updatePromptSelection()});
}
function draftBusy(busy){$('previewTuning').disabled=busy;$('previewTuning').textContent=busy?'大模型正在生成提示词…':'让大模型生成整批提示词';$('previewTuning').setAttribute('aria-busy',String(busy));if(busy)note($('promptMessage'),'提示词正在后台生成，切换页面后可继续查看进度。')}
async function pollDraft(){if(!draftTask)return;try{const task=await api('/keyframe-prompt-tasks/'+draftTask);if(task.status==='running'){draftBusy(true);return}draftTask='';draftRequest=null;draftBusy(false);if(task.status==='error'){note($('promptMessage'),task.error,'bad');saveWorkflow();return}previewPairs=task.result.items;promptSelection={};approved=false;saveWorkflow();renderPrompts();note($('promptMessage'),`已生成 ${previewPairs.length} 条提示词，已自动保存，请审核。`,'good')}catch(e){note($('promptMessage'),'暂时无法读取进度：'+e.message+'。将自动重试。','bad')}}
async function submitDraft(){draftBusy(true);try{const task=await api('/keyframe-prompt-tasks',{method:'POST',body:JSON.stringify(draftRequest)});draftTask=task.id;draftRequest=null;saveWorkflow();await pollDraft()}catch(e){draftRequest=null;saveWorkflow();draftBusy(false);note($('promptMessage'),e.message,'bad')}}
$('previewTuning').onclick=()=>{if(draftTask||draftRequest)return;draftRequest={...tuning(),...(window.PromptInputs?.read()||{}),requestId:crypto.randomUUID()};saveWorkflow();submitDraft()};
$('confirmTuning').onclick=()=>{if(!selectedPromptPairs().length)return;approved=true;saveWorkflow();renderPrompts();$('quantityCard').scrollIntoView({behavior:'smooth',block:'center'})};
function imageFeedback(){const p=currentImageBatch?.progress;const active=imageSubmitting||!!p?.active;
 $('startImages').disabled=active;$('startImages').setAttribute('aria-busy',String(active));
 $('startImages').textContent=imageSubmitting?'正在提交图片任务…':p?.active?`图片生成中 · ${p.complete}/${p.total} 完成`:`生成选中的 ${selectedPromptPairs().length} 张图片`;
 if(p){note($('pairMessage'),p.active?`正在生成图片：${p.complete}/${p.total} 完成，${p.active} 张处理中，${p.errors} 张失败。可切换页面，任务和草稿会保留。`:`图片批次已结束：${p.complete}/${p.total} 完成，${p.errors} 张失败。`,p.errors?'bad':'good')}
}
$('startImages').onclick=async()=>{if(imageSubmitting||currentImageBatch?.progress?.active)return;try{if(!provider.keyframeConfigured)throw Error('当前没有可用的首帧图片模型');if(!selectedPromptPairs().length||!approved)throw Error('请先生成并确认提示词');imageSubmitting=true;imageFeedback();note($('pairMessage'),'正在提交图片任务，请稍候…');const batch=await api('/keyframe-batches',{method:'POST',body:JSON.stringify({...tuning(),count:selectedPromptPairs().length,items:selectedPromptPairs()})});currentImageBatch=batch;currentVideoBatch='';saveWorkflow();$('imageReviewCard').classList.remove('hidden');renderImageBatch();$('imageReviewCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){note($('pairMessage'),e.message,'bad')}finally{imageSubmitting=false;imageFeedback()}};
$('selectAllPrompts').onclick=()=>chooseAllPrompts(true);$('clearPromptSelection').onclick=()=>chooseAllPrompts(false);renderPrompts();draftBusy(!!draftTask||!!draftRequest);
window.addEventListener('pagehide',saveWorkflow);
document.addEventListener('workbench:collect-prompt-drafts',event=>{const chosen=previewPairs.filter(item=>promptSelection[item.id]);event.detail.items=chosen.flatMap(item=>[{id:item.id+':image',prompt:document.querySelector(`[data-prompt="${item.id}"]`)?.value||item.imagePrompt},{id:item.id+':video',prompt:item.videoPrompt}]);event.detail.context={template:'家庭上门按摩',brand:$('brandText')?.value||'伊趣舒心',kind:'paired-image-and-video-prompts'};event.detail.apply=rewrites=>{const map=new Map(rewrites.map(item=>[item.id,item.prompt]));previewPairs=previewPairs.map(item=>map.has(item.id+':image')?{...item,imagePrompt:map.get(item.id+':image'),videoPrompt:map.get(item.id+':video')||item.videoPrompt}:item);approved=false;saveWorkflow();renderPrompts()}});
document.addEventListener('workbench:remove-prompt',event=>{previewPairs=previewPairs.filter(p=>p.id!==event.detail.id);delete promptSelection[event.detail.id];approved=false;saveWorkflow();renderPrompts()});
document.addEventListener('workbench:reuse',event=>{const record=event.detail;if(record.kind!=='paired'||!record.result?.items)return;previewPairs=record.result.items.map(p=>({...p}));promptSelection={};approved=false;saveWorkflow();renderPrompts();window.WorkbenchUI?.show('prompts');note($('promptMessage'),'已载入历史提示词，请重新勾选并确认后生成。','good')});

function statusText(x){return({queued:'等待提交',submitting:'提交中',waiting:'等待生成',running:'生成中',complete_pending_download:'正在保存图片',review_pending:'等待试片确认',complete:'已完成',error:'失败'})[x]||x}
function saveVideoDirections(){document.querySelectorAll('[data-video-extra]').forEach(x=>videoDirections[x.dataset.videoExtra]=x.value)}
function renderImageBatch(){if(!currentImageBatch)return;saveVideoDirections();imageFeedback();saveWorkflow();const p=currentImageBatch.progress;$('imageProgress').textContent=`${p.complete}/${p.total} 完成 · ${p.errors} 失败`;if(document.activeElement?.matches('[data-video-extra]'))return;$('imageGallery').innerHTML=currentImageBatch.items.map(item=>`<article class="shot">${item.previewUrl?`<img src="${item.previewUrl}?v=${item.generation}" alt="参考图 ${item.index}">`:`<div class="empty"><span class="status"><i class="dot ${esc(item.status)}"></i>${esc(statusText(item.status))}${item.error?`<br>${esc(item.error)}`:''}</span></div>`}<div class="shotmeta"><b>第 ${item.index} 张</b><small>${esc(item.variation.appearance)}<br>${esc(item.variation.clothing)}</small>${item.status==='complete'?`<label class="accept"><input type="checkbox" data-accept="${item.id}" ${accepted[item.id]===false?'':'checked'}> 生成视频</label><label class="mini-label">这条视频补充</label><textarea data-video-extra="${item.id}" placeholder="例如：人物背过去，改为按摩背部，从后侧拍。">${esc(videoDirections[item.id]||'')}</textarea>`:''}<button class="tiny" data-regen="${item.id}">重新生成图片</button></div></article>`).join('');document.querySelectorAll('[data-video-extra]').forEach(x=>x.oninput=()=>{videoDirections[x.dataset.videoExtra]=x.value;saveWorkflow()});document.querySelectorAll('[data-accept]').forEach(x=>x.onchange=()=>{accepted[x.dataset.accept]=x.checked;saveWorkflow()});document.querySelectorAll('[data-regen]').forEach(b=>b.onclick=async()=>{try{currentImageBatch=await api(`/keyframe-batches/${currentImageBatch.id}/regenerate`,{method:'POST',body:JSON.stringify({itemIds:[b.dataset.regen]})});renderImageBatch()}catch(e){note($('imageMessage'),e.message,'bad')}})}
$('applyBatchDirection').onclick=()=>{const value=$('batchVideoDirection').value.trim();if(!currentImageBatch)return;for(const item of currentImageBatch.items)if(item.status==='complete')videoDirections[item.id]=value;renderImageBatch()};
$('confirmImages').onclick=async()=>{try{saveVideoDirections();const itemIds=[...document.querySelectorAll('[data-accept]:checked')].map(x=>x.dataset.accept);if(!itemIds.length)throw Error('请至少勾选一张已完成图片');const route=(provider.routes||[]).find(x=>x.id===$('pairRoute').value);const itemDirections=Object.fromEntries(itemIds.map(id=>[id,videoDirections[id]||'']));const result=await api(`/keyframe-batches/${currentImageBatch.id}/confirm`,{method:'POST',body:JSON.stringify({itemIds,itemDirections,batchVideoPrompt:$('batchVideoDirection').value,referenceMode:'reference-image',videoRoute:$('pairRoute').value,videoModel:route?.model||'',duration:Number($('pairDuration').value),resolution:$('pairResolution').value})});currentImageBatch=result.imageBatch;currentVideoBatch=result.videoBatch.id;saveWorkflow();$('videoBatchCard').classList.remove('hidden');$('confirmImages').disabled=false;note($('imageMessage'),`${itemIds.length} 条已保存，先生成 1 条试片，确认后继续剩余视频。`,'good');refreshVideoJobs()}catch(e){note($('imageMessage'),e.message,'bad')}};
async function refreshVideoJobs(){if(currentVideoBatch)window.VideoPreview?.reviewBatch(currentVideoBatch,$('videoJobs'));if(!currentVideoBatch)return;try{const jobs=await api('/jobs?batch='+encodeURIComponent(currentVideoBatch));const done=jobs.filter(x=>x.status==='complete'&&x.outputs?.length).length,active=jobs.some(x=>['queued','draft_pending','drafting','submitting','waiting','running'].includes(x.status));$('videoProgress').textContent=`${done}/${jobs.length} 完成`;$('downloadAll').disabled=!done||active;$('downloadAll').textContent=done===jobs.length?`一键下载全部 ${done} 条`:`下载已完成 ${done} 条`;$('videoJobs').innerHTML=jobs.map(j=>{const hasBgm=/配上优雅暧昧的音乐/.test(j.prompt||''),version=j.choices?.promptVersion||'legacy';return `<article class="promptcard"><b>视频 ${j.index}</b><div class="tags"><span class="tag">${esc(statusText(j.status))}</span><span class="tag">${esc(j.referenceMode==='reference-image'?'自由参考':j.referenceMode==='visual-brief'?'描述重绘':'首帧')}</span><span class="tag">${hasBgm?'BGM 指令已写入':'旧任务 · 无 BGM 指令'}</span></div><p>${esc(j.providerProgress?.accountName?'执行账号：'+j.providerProgress.accountName+' · '+(j.providerProgress.message||statusText(j.status)):'')} ${esc(j.error||j.choices?.userDirection||j.choices?.camera?.text||'独立镜头')}</p><details><summary>查看最终提示词 · ${esc(version)}</summary><pre>${esc(j.prompt||'')}</pre></details>${j.status==='complete'&&j.outputs?.length?`<div class="download-actions"><a class="btn red" href="/api/video/${j.id}?download=1" download>↓ 下载 MP4</a><a class="btn alt" href="/api/video/${j.id}" target="_blank">预览</a></div>`:''}</article>`}).join('')}catch(e){$('videoProgress').textContent=e.message}}
function triggerDownload(url){const a=document.createElement('a');a.href=url;a.download='';document.body.appendChild(a);a.click();a.remove()}
async function pollBatchDownload(){if(!currentVideoBatch)return;try{const state=await api(`/batches/${currentVideoBatch}/download`);$('downloadAll').disabled=true;$('downloadAll').textContent=`正在准备 ${state.complete}/${state.total}`;if(state.ready){triggerDownload(`/api/batches/${currentVideoBatch}/archive`);$('downloadAll').disabled=false;$('downloadAll').textContent=`再次下载 ${state.total} 条`;$('downloadMessage').textContent='ZIP 已准备并开始下载。';return}if(!state.running&&state.errors?.length){$('downloadAll').disabled=false;$('downloadMessage').textContent=`${state.errors.length} 条保存失败：${state.errors[0].message}`;return}setTimeout(pollBatchDownload,1500)}catch(e){$('downloadAll').disabled=false;$('downloadMessage').textContent=e.message}}
$('downloadAll').onclick=async()=>{try{$('downloadAll').disabled=true;$('downloadMessage').textContent='正在把视频保存到本机并打包…';const state=await api(`/batches/${currentVideoBatch}/download`,{method:'POST',body:'{}'});$('downloadAll').textContent=`正在准备 ${state.complete}/${state.total}`;pollBatchDownload()}catch(e){$('downloadAll').disabled=false;$('downloadMessage').textContent=e.message}};
let ticking=false;async function tick(){if(ticking)return;ticking=true;try{if(draftTask)await pollDraft();if(currentImageBatch&&!currentImageBatch.videoBatchId){try{currentImageBatch=await api(`/keyframe-batches/${currentImageBatch.id}`);renderImageBatch()}catch{}}if(currentVideoBatch)await refreshVideoJobs()}finally{ticking=false}}
(async()=>{try{let packs,batches;[provider,packs,batches]=await Promise.all([api('/provider'),api('/content-packs'),api('/keyframe-batches')]);renderContentNav(packs);renderApiStatus();routeOptions('pairRoute');cache.restore();syncPairVideoSettings();cache.restore();if(draftRequest)submitDraft();if(draftTask)pollDraft();const restored=batches.find(b=>b.id===saved.currentImageBatchId)||batches[0];if(restored){currentImageBatch=restored;$('imageReviewCard').classList.remove('hidden');renderImageBatch();if(currentImageBatch.videoBatchId){currentVideoBatch=currentImageBatch.videoBatchId;$('videoBatchCard').classList.remove('hidden');refreshVideoJobs()}}setInterval(()=>tick(),3500);window.WorkbenchDataReady=true;document.dispatchEvent(new Event('workbench:ready'))}catch(e){note($('pairMessage'),e.message,'bad')}})();
</script>
<script src="/video-cards.js"></script><script src="/video-preview.js"></script><script src="/image-warehouse.js"></script><script src="/prompt-inputs.js"></script></body></html>
