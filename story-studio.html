<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帧间 · 15 秒短剧</title>
<style>
:root{--ink:#171714;--paper:#f2efe8;--card:#fbfaf6;--line:#d8d3c8;--muted:#77766f;--red:#cf4e2b;--green:#307a57;--amber:#bd7317;font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-width:1080px}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:62px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 24px;gap:24px}.brand{font-weight:900;letter-spacing:-.06em;font-size:20px}.brand em{font-style:normal;color:#ef6b47}.mode-switch{display:flex;align-self:stretch;border-left:1px solid #33332f}.mode-switch a{display:flex;flex-direction:column;justify-content:center;gap:3px;color:#8f8f88;text-decoration:none;padding:0 18px;border-bottom:3px solid transparent}.mode-switch a b{font-size:11px}.mode-switch a small{font:700 8px ui-monospace,monospace}.mode-switch a:hover{color:#fff}.tabs{display:flex;align-self:stretch}.tab{display:flex;align-items:center;border:0;background:transparent;color:#9f9f98;padding:0 20px;font-size:13px;font-weight:700;border-bottom:3px solid transparent;text-decoration:none}.tab.active{color:#fff;border-color:#ef6b47}.status{margin-left:auto;font-size:11px;color:#aaa}.status b{color:#fff}.page{padding:22px 24px 70px}.headline{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.headline h1{font:900 31px/1.1 "Songti SC","STSong",serif;letter-spacing:-.045em;margin:0}.headline p{font-size:11px;color:var(--muted);margin:7px 0 0}.step{font:800 9px ui-monospace,monospace;color:#999}.contentbar{display:flex;align-items:center;gap:7px;margin:-4px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}.contentbar>span{font:800 9px ui-monospace,monospace;color:#999;margin-right:5px}.contentbar a{border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#777;text-decoration:none;font-size:10px;font-weight:800;background:#faf8f2}.contentbar a.active{background:var(--ink);border-color:var(--ink);color:#fff}.contentbar a.story{margin-left:auto}.layout{display:grid;grid-template-columns:350px minmax(620px,1fr);gap:15px;align-items:start}.stack{display:grid;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{font-size:14px;margin:0}.body{padding:17px}.field{margin-bottom:14px}.label{display:block;font-size:11px;font-weight:800;margin-bottom:8px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;font-size:11px;outline:0}textarea{resize:vertical;min-height:90px;line-height:1.55}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:11px 14px;font-size:11px;font-weight:900}.btn.red{background:var(--red);border-color:var(--red)}.btn.alt{background:#fff;color:var(--ink);border-color:#aaa}.btn:disabled{opacity:.4;cursor:not-allowed}.wide{width:100%}.notice{font-size:10px;line-height:1.55;border-left:3px solid var(--amber);background:#fff6e6;padding:10px 12px;margin-top:10px}.notice.good{border-color:var(--green);background:#edf8f1}.notice.bad{border-color:var(--red);background:#fff0ed}.prompts,.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.prompt,.job{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px}.prompt h3,.job h3{font-size:12px;margin:0}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{font:700 9px ui-monospace,monospace;background:#eeeae0;padding:4px 6px;border-radius:3px}.prompt textarea{min-height:260px;font-size:10px}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}.job p{font-size:10px;color:var(--muted);line-height:1.5}.download{display:flex;gap:7px;margin-top:10px}.download a{text-decoration:none;text-align:center;flex:1}.hidden{display:none!important}@media(max-width:1100px){.layout{grid-template-columns:320px 1fr}.prompts,.jobs{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="brand">帧<em>间</em></div><nav class="mode-switch"><a href="/?mode=store"><small>MODE 01</small><b>足浴店底图 → 多视频</b></a><a href="/?mode=paired"><small>MODE 02</small><b>家庭按摩 · 每图一视频</b></a></nav><nav class="tabs"><a class="tab active" href="/story">15 秒短剧</a><a class="tab" href="/?mode=store&tab=accounts">豆包账号池</a></nav><div class="status" id="apiStatus">接口检查中</div></header>
<main class="page"><div class="headline"><div><h1>两人争执，15 秒完成广告反转</h1><p>甲方资料 → 批量提示词 → 人工确认 → 文生视频</p></div><span class="step">BRIEF → DIALOGUE → REVIEW → TEXT-TO-VIDEO</span></div>
<nav id="contentNav" class="contentbar"><span>内容模板</span></nav>
<div class="layout"><aside class="stack"><section class="card"><div class="head"><h2>01 · 甲方与场景</h2><span class="step">BRIEF</span></div><div class="body">
<div class="field"><label class="label">甲方名称</label><input id="brandName" value="人民金行"></div>
<div class="field"><label class="label">宣传内容</label><textarea id="brief" placeholder="只填写可以公开宣传的真实信息、产品、服务和必须出现的表达。"></textarea></div>
<div class="field"><label class="label">短剧场景</label><select id="sceneId"><option value="reenactment">生活场景模拟</option><option value="ktv">KTV 场景</option><option value="surveillance">监控摄像头视角</option></select></div>
<div class="field"><label class="label">数量</label><input id="count" type="number" min="1" max="30" value="3"></div>
<button id="draft" class="btn wide">生成整批 15 秒提示词</button><div id="draftMessage"></div>
<div class="notice">只使用你提供的甲方事实，不编造价格、收益、承诺、资质或官方背书。</div>
</div></section><section id="runCard" class="card hidden"><div class="head"><h2>03 · 批量生成</h2><span class="step">TEXT ONLY</span></div><div class="body"><div class="field"><label class="label">支持 15 秒的模型</label><select id="videoRoute"></select></div><div class="field"><label class="label">分辨率</label><select id="resolution"><option>480P</option><option>720P</option><option>1080P</option></select></div><button id="run" class="btn red wide">确认并批量生成视频</button><div id="runMessage"></div></div></section></aside>
<div class="stack"><section class="card"><div class="head"><h2>02 · 提示词审核</h2><button id="confirm" class="btn alt" disabled>确认提示词</button></div><div class="body"><div id="prompts" class="prompts"><div class="notice">填写甲方内容后生成。</div></div></div></section>
<section id="jobsCard" class="card hidden"><div class="head"><h2>视频批次</h2><div><span id="progress" class="step"></span> <button id="downloadAll" class="btn red" disabled>一键下载全部</button></div></div><div class="body"><div id="jobs" class="jobs"></div><div id="downloadMessage"></div></div></section></div></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(route,options={}){const r=await fetch('/api'+route,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),data=await r.json();if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);return data}
function note(id,text,type=''){ $(id).innerHTML=`<div class="notice ${type}">${esc(text)}</div>` }
function renderContentNav(packs){$('contentNav').innerHTML='<span>内容模板</span>'+packs.filter(p=>p.status==='active'&&p.engine!=='timeline-story').map(p=>`<a href="${p.engine==='reference-pairs'?`/?mode=paired&pack=${encodeURIComponent(p.id)}`:`/?mode=store&pack=${encodeURIComponent(p.id)}`}">${esc(p.navLabel||p.name)}</a>`).join('')+'<a class="active story" href="/story">15 秒短剧</a>'}
let provider={},items=[],batchId='',confirmed=false;
function syncRoutes(){const routes=(provider.routes||[]).filter(r=>r.configured&&Number(r.duration?.max||0)>=15);$('videoRoute').innerHTML=routes.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} · ${esc(r.model)}</option>`).join('');$('run').disabled=!routes.length;syncResolution()}
function syncResolution(){const route=(provider.routes||[]).find(r=>r.id===$('videoRoute').value),values=route?.resolutions||['480P'];$('resolution').innerHTML=values.map(v=>`<option>${esc(v)}</option>`).join('')}
function readPrompts(){items=items.map(item=>({...item,prompt:document.querySelector(`[data-prompt="${item.id}"]`)?.value||item.prompt}))}
$('draft').onclick=async()=>{try{$('draft').disabled=true;$('draft').textContent='大模型正在编写…';const result=await api('/story-prompt-batches',{method:'POST',body:JSON.stringify({brandName:$('brandName').value,brief:$('brief').value,sceneId:$('sceneId').value,count:Number($('count').value)})});items=result.items;confirmed=false;$('prompts').innerHTML=items.map(item=>`<article class="prompt"><h3>${esc(item.title)}</h3><div class="tags"><span class="tag">${esc(item.sceneName)}</span><span class="tag">15 秒</span><span class="tag">两人对白</span></div><textarea data-prompt="${item.id}">${esc(item.prompt)}</textarea></article>`).join('');$('confirm').disabled=false;$('confirm').textContent='确认提示词';note('draftMessage',`已生成 ${items.length} 条，请逐条审核。`,'good')}catch(e){note('draftMessage',e.message,'bad')}finally{$('draft').disabled=false;$('draft').textContent='生成整批 15 秒提示词'}};
$('confirm').onclick=()=>{readPrompts();confirmed=true;$('confirm').disabled=true;$('confirm').textContent='✓ 已确认';$('runCard').classList.remove('hidden');$('runCard').scrollIntoView({behavior:'smooth',block:'center'})};
$('videoRoute').onchange=syncResolution;
$('run').onclick=async()=>{try{if(!confirmed)throw Error('请先确认提示词');readPrompts();$('run').disabled=true;const result=await api('/story-video-batches',{method:'POST',body:JSON.stringify({items,videoRoute:$('videoRoute').value,resolution:$('resolution').value})});batchId=result.id;$('jobsCard').classList.remove('hidden');note('runMessage',`${items.length} 条 15 秒短剧已进入生成队列。`,'good');refreshJobs()}catch(e){note('runMessage',e.message,'bad')}finally{$('run').disabled=false}};
const statusName={queued:'等待提交',submitting:'提交中',waiting:'等待生成',running:'生成中',complete:'已完成',error:'失败',needs_review:'需确认'};
async function refreshJobs(){if(!batchId)return;try{const jobs=await api('/jobs?batch='+encodeURIComponent(batchId)),done=jobs.filter(j=>j.status==='complete'&&j.outputs?.length).length,active=jobs.some(j=>['queued','submitting','waiting','running'].includes(j.status));$('progress').textContent=`${done}/${jobs.length} 完成`;$('downloadAll').disabled=!done||active;$('jobs').innerHTML=jobs.map(j=>`<article class="job"><h3>${esc(j.skillName)}</h3><div class="tags"><span class="tag">${esc(statusName[j.status]||j.status)}</span><span class="tag">15 秒</span></div><p>${esc(j.error||j.choices?.brandName||'')}</p>${j.status==='complete'&&j.outputs?.length?`<div class="download"><a class="btn red" href="/api/video/${j.id}?download=1" download>下载 MP4</a><a class="btn alt" href="/api/video/${j.id}" target="_blank">预览</a></div>`:''}</article>`).join('')}catch(e){$('progress').textContent=e.message}}
function trigger(url){const a=document.createElement('a');a.href=url;a.download='';document.body.appendChild(a);a.click();a.remove()}
async function pollDownload(){try{const state=await api(`/batches/${batchId}/download`);$('downloadAll').disabled=true;$('downloadAll').textContent=`正在准备 ${state.complete}/${state.total}`;if(state.ready){trigger(`/api/batches/${batchId}/archive`);$('downloadAll').disabled=false;$('downloadAll').textContent='再次下载全部';note('downloadMessage','ZIP 已准备并开始下载。','good');return}setTimeout(pollDownload,1500)}catch(e){$('downloadAll').disabled=false;note('downloadMessage',e.message,'bad')}}
$('downloadAll').onclick=async()=>{try{await api(`/batches/${batchId}/download`,{method:'POST',body:'{}'});pollDownload()}catch(e){note('downloadMessage',e.message,'bad')}};
(async()=>{try{let packs;[provider,packs]=await Promise.all([api('/provider'),api('/content-packs')]);renderContentNav(packs);$('apiStatus').innerHTML=`<b>多模型路由</b> · ${esc(provider.promptModel||'未配置')}`;syncRoutes();setInterval(refreshJobs,3500)}catch(e){note('draftMessage',e.message,'bad')}})();
</script></body></html>
