<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帧间 · 模板创作</title><link rel="stylesheet" href="/workbench-ui.css"><link rel="stylesheet" href="/replica-ui.css"><script defer src="/workbench-ui.js"></script><script defer src="/replica-ui.js"></script></head><body data-workspace="replica"><main class="replica-page"><header class="replica-banner"><div><small>让好创意，成为你的模板</small><h1 id="pageTitle">参考一次，反复创作</h1><p id="pageDescription">选择参考视频，换成你的内容与图片，保存喜欢的模板。</p></div><a class="button secondary" href="/production">进入预设生产 ↗</a></header><div id="status" role="status" aria-live="polite"></div><section id="presetsPage" hidden><div class="toolbar preset-tools"><input id="presetSearch" placeholder="搜索预设或客户"><select id="customerFilter"><option value="">全部客户</option></select><select id="categoryFilter"><option value="">全部用途</option></select><a class="button" href="/clone?new=1">＋ 添加模板</a><button id="newActionPack" class="secondary">＋ 动作包</button></div><div id="presetCards" class="preset-grid"></div><section class="action-library"><h2>我的动作包</h2><p class="hint">把常用动作组成一个包，不同模板、不同客户都可以复用。</p><div id="actionCards" class="preset-grid"></div></section></section><div id="clonePage" class="replica-columns"><aside class="panel"><h2>01 · 选择参考</h2><label class="video-upload">＋ 导入参考视频<input id="referenceVideo" type="file" accept="video/*"></label><video id="sourcePlayer" controls preload="none" hidden></video><label>以往参考<select id="sourceHistory"><option value="">选择已保存的参考</option></select></label><div id="frames" class="frames"></div><label>创作想法（选填）<textarea id="direction" rows="4" maxlength="3000" placeholder="例如：保留科技感开场，换成我的耳机产品展示"></textarea></label><button id="analyze" disabled>提炼成我的模板</button><button id="manual" class="secondary">没有参考？写想法创建</button><details><summary>更多参考设置</summary><label>声音补充（选填）<textarea id="audioNotes" maxlength="2000" placeholder="例如：轻快音乐，无对白"></textarea></label><button id="deleteSource" class="secondary" disabled>删除参考记录</button></details><p id="analysisModel" hidden></p></aside><section class="panel editor"><div class="toolbar"><h2>02 · 换成你的内容</h2><span id="templateState">选择一个参考开始</span></div><div id="editorEmpty" class="empty">喜欢它的风格？<br>导入视频，或直接描述你想要的模板。</div><div id="templateEditor" hidden><label>模板名称<input id="templateName" maxlength="80" placeholder="给这个创意起个名字"></label><p id="analysisSummary" class="template-summary"></p><div class="row"><label>客户 / 品牌<input id="presetCustomer" maxlength="80" placeholder="例如：人民金行"></label><label>用途<input id="presetCategory" maxlength="40" placeholder="例如：商品展示"></label></div><h3>替换原视频内容</h3><p class="hint">每行填写一个版本，批量时自动搭配。只填一个，就保持一致。</p><div id="variables"></div><section class="image-section"><div class="toolbar"><h3>初始图片 / 主体图片</h3><button id="uploadInitial" class="secondary">＋ 上传图片</button></div><input id="initialImageFile" type="file" accept="image/*" hidden><label>图片用途<select id="imageMode"><option value="first-frame">作为视频初始画面</option><option value="reference-image">替换商品、人物或场景</option></select></label><div id="imageChoices"></div><p class="hint">初始画面选1张，主体参考最多3张。也可以不选图片。</p></section><label>动作包<select id="actionPack"><option value="">保留模板原动作</option></select></label><label>本次补充（选填）<textarea id="replicaIdea" rows="3" maxlength="2000" placeholder="例如：结尾展示新产品，保留原来的镜头风格"></textarea></label><button id="improveTemplate" class="secondary">按我的想法优化模板</button><div hidden><textarea id="fixedRules"></textarea><textarea id="promptTemplate"></textarea><textarea id="beats"></textarea><button id="addVariable"></button></div><button id="previewPrompts" class="secondary">查看本批次提示词</button><div id="promptPreview"></div></div><div class="toolbar results-heading"><h2>成片与进度</h2><button id="downloadBatch" class="secondary" disabled>下载本批次 ZIP</button></div><div id="results" class="result-grid"><p class="hint">生成的结果会保存在素材与历史中。</p></div></section><aside class="panel controls"><h2>03 · 保存与生产</h2><label>生成模型<select id="videoRoute"></select></label><div class="row"><label>时长<select id="duration"></select></label><label>画面比例<select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></label></div><label>画质<select id="resolution"></select></label><p id="routeHint" class="hint"></p><label>生成数量<input id="count" type="number" value="3" min="1" max="100"></label><button id="trial" disabled>先生成1条看看</button><label class="check" hidden><input id="trialAccepted" type="checkbox" disabled>效果满意，继续批量生产</label><button id="bulk" disabled>开始批量生产</button><label class="check" hidden><input id="skipTrial" type="checkbox">使用已确认的模板，直接生成</label><hr><button id="savePreset" class="secondary" disabled>保存为预设</button><a class="button secondary" href="/production">查看我的预设</a></aside></div></main><script src="/video-cards.js"></script><script src="/video-preview.js"></script><script src="/image-warehouse.js"></script></body></html>
